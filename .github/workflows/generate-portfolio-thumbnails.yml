# migration-version: 2
name: Generate portfolio thumbnails

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-portfolio-thumbnails.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-thumbnail-migration
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate WebP thumbnails and update data
        run: python scripts/generate_thumbnails.py

      - name: Commit generated thumbnails
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No thumbnail changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate lightweight portfolio thumbnails"
          git push
